# Local development profile (run with --spring.profiles.active=local — the scripts do).
# Committed on purpose: it contains no secrets, only dev switches.
spring:
  liquibase:
    contexts: demo,showcase   # showcase is past reports over the cities

auth:
  mock:
    enabled: true          # Authorization: Bearer <any-username> signs you in

animals:
  owner-registry:
    mock-server: true      # this app serves /mock-registry itself — works offline

reports:
  coordinators: coordinator
  road-map:
    url: https://gsavalik.envir.ee/geoserver/etak/wfs
  hash-secret: local-development-only
  address-register:
    # X-Road through the imitated security server of this app, which passes the question
    # to the public address service. An address with "register-down" shows a failure.
    mode: xroad
    mock-server: true      # this app serves /mock-registry/ads itself
  unit-channel:
    # An accepted report goes to the unit as an X-Road message, through the same imitated
    # security server, which stands in for the inbox of the unit too.
    mode: xroad
