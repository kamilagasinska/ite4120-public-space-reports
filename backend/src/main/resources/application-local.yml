# Local development profile (run with --spring.profiles.active=local — the scripts do).
# Committed on purpose: it contains no secrets, only dev switches.
auth:
  mock:
    enabled: true          # Authorization: Bearer <any-username> signs you in

animals:
  owner-registry:
    mock-server: true      # this app serves /mock-registry itself — works offline

reports:
  coordinators: coordinator
  hash-secret: local-development-only
  address-register:
    # The public address service of Estonia. For the imitated register or for showing
    # a failure set REPORTS_ADDRESS_URL to http://localhost:18440/mock-registry/ads
    url: ${REPORTS_ADDRESS_URL:https://inaadress.maaamet.ee/inaadress}
    mock-server: true      # this app serves /mock-registry/ads itself
